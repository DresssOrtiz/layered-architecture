services:
  mariadb:
    image: mariadb:11
    container_name: layered-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: layered_db
      MARIADB_USER: layered_user
      MARIADB_PASSWORD: layered_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: layered-backend
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: layered_user
      DB_PASSWORD: layered_password
      DB_NAME: layered_db
    ports:
      - "3000:3000"
    depends_on:
      mariadb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: layered-frontend
    restart: unless-stopped
    environment:
      GRAPHQL_URL: http://backend:3000/graphql
    ports:
      - "5173:3000"
    depends_on:
      - backend

volumes:
  mariadb_data:
