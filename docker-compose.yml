services:
  mariadb:
    image: mariadb:11
    container_name: layered-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: layered_db
      MARIADB_USER: layered_user
      MARIADB_PASSWORD: layered_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: