# Los valores por defecto permiten levantar el stack sin .env; copia .env.example
# a .env para sobrescribir credenciales y puertos.
services:
  mariadb:
    image: mariadb:11
    container_name: layered-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-layered_db}
      MARIADB_USER: ${DB_USER:-layered_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-layered_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: layered-backend
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ${DB_USER:-layered_user}
      DB_PASSWORD: ${DB_PASSWORD:-layered_password}
      DB_NAME: ${DB_NAME:-layered_db}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      RATE_LIMIT_INSCRIPCION: ${RATE_LIMIT_INSCRIPCION:-5}
      RATE_LIMIT_TTL: ${RATE_LIMIT_TTL:-60000}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      # GET /health comprueba además que MariaDB siga respondiendo.
      test:
        ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: layered-frontend
    restart: unless-stopped
    environment:
      GRAPHQL_URL: http://backend:3000/graphql
    ports:
      - "${FRONTEND_PORT:-5173}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mariadb_data:
